name: C++ build and test

on:
  push:
    branches:
      - main
      - codex/driver-model-foundation-fixes
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libeigen3-dev \
            nlohmann-json3-dev \
            libspdlog-dev \
            libgtest-dev

      - name: Install EnTT
        run: |
          git clone --depth 1 --branch v3.13.2 https://github.com/skypjack/entt.git /tmp/entt
          cmake -S /tmp/entt -B /tmp/entt/build -G Ninja -DENTT_BUILD_TESTING=OFF
          sudo cmake --install /tmp/entt/build

      - name: Check repository hygiene
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "Ignored/generated files are tracked:"
            echo "$tracked_ignored"
            exit 1
          fi

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF

      - name: Build
        run: cmake --build build/ci -j 2

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure -j 2
