# PINN Tire Model Configuration

# Model Architecture
model:
  architecture: multi_head
  hidden_dims: []
  input_dim: 5
  output_dim: 4
  use_layer_norm: true
  head_hidden_dims:
    fx: [128, 128, 64, 64, 32]
    fy_mz: [128, 128, 64, 64, 32]
    mx: [64, 64, 32]

# Training Parameters
training:
  max_epochs: 260
  batch_size: 512
  learning_rate: 0.002
  weight_decay: 1.0e-5
  patience: 20
  val_interval: 5
  gradient_clip_norm: 1.0

# Data Split
data:
  split_strategy: group  # group: run-level holdout, random: point-level interpolation split
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42
  sampling_seed: 42
  max_samples_total: 120000
  # Inflation-pressure filter (#18 stage 1): train only on samples at the running
  # pressure (TTC P column). 82.7 kPa = 12 psi, the majority pressure of every TTC
  # round in data/tiredata (43-74 % of samples). null pools all pressures (old behaviour).
  # Must match tire.pressure_kpa of the vehicle JSON that uses the exported model.
  pressure_filter_kpa: 82.7
  pressure_tolerance_kpa: 3.5  # +/-0.5 psi; TTC steps are 2 psi (13.8 kPa)

# Curriculum Learning Schedule
curriculum:
  phase_a_end: 50      # Data loss only
  phase_b_end: 120     # + Zero slip + Symmetry
  phase_c_end: 200     # + Friction circle + Monotonicity + trend constraints
  phase_d_end: 260     # Final weights

  # Final physics loss weights (Phase D)
  final_weights:
    zero: 10.0      # Most critical
    sym: 5.0
    fric: 2.0
    mono: 1.0       # Least critical
    fy_sa_zero: 15.0  # SA=0 Fy leakage constraint
    combined: 0.50    # Combined slip consistency
    stiffness: 0.05   # Small-slip stiffness load trend
    high_sa_lateral: 0.10  # High-|SA| |Fy| load monotonicity
    mz_trail: 0.10    # Mz / pneumatic trail sanity
    camber: 0.10      # Camber thrust symmetry/cap
    smoothness: 0.02  # Pure-section curvature smoothness

# Physics Constraints
physics:
  # Zero slip constraint
  zero_slip:
    force_threshold_n: 2.0   # [N] target at SR=SA=0
    moment_threshold_nm: 5.0 # [Nm] target at SR=SA=0
    n_colloc_points: 128  # Per batch

  # Symmetry constraint
  symmetry:
    n_colloc_points: 256  # Pairs per batch

  # Friction circle constraint
  friction_circle:
    mu_cap: 2.6           # Peak friction + 10% margin
    n_colloc_points: 128

  # Monotonicity constraint (expensive)
  monotonicity:
    enable: true
    n_colloc_points: 64
    epsilon: 1.0e-6

  # Combined slip consistency (weak shape prior)
  combined_slip:
    n_colloc_points: 128
    margin: 0.03

  # Fy leakage when SA=0 (independent of SR)
  fy_sa_zero:
    force_threshold: 20.0
    n_colloc_points: 128

  # High-|SA| lateral-force load monotonicity
  high_sa_lateral_load:
    min_abs_sa_deg: 6.0
    drop_margin: 0.01
    mu_cap: 2.6
    n_colloc_points: 64

  # Small-slip stiffness load sensitivity (weak trend prior)
  stiffness_load:
    n_colloc_points: 64
    sr_delta: 0.01
    sa_delta_deg: 0.25

  # Aligning torque / pneumatic trail sanity
  mz_trail:
    n_colloc_points: 128
    small_sa_deg: 1.5
    large_sa_deg: 6.0
    min_abs_sa_deg: 1.0
    max_trail_m: 0.18
    min_trail_m: 0.0
    trail_margin_m: 0.01
    min_lateral_force_n: 75.0
    sign_loss_weight: 0.5
    odd_loss_weight: 0.10

  # Camber thrust at zero slip
  camber_thrust:
    n_colloc_points: 128
    camber_mu_cap: 0.25

  # Smooth pure-slip sections. This is a weak shape prior to prefer
  # sigmoid/Magic-Formula-like curves without forcing exact target points.
  section_smoothness:
    n_colloc_points: 128
    sr_delta: 0.015
    sa_delta_deg: 0.75
    mu_cap: 2.6
    mz_scale_m: 0.06
    force_deadband: 0.015
    mz_deadband: 0.030
    mz_weight: 0.5
    slope_sign_weight: 0.0

# Data Loss Weights
data_loss:
  component_weights:
    fx: 1.0
    fy: 1.0
    mx: 0.5
    mz: 0.5
  near_zero_weights:
    fx:
      enabled: false
      sr_abs: 0.03
      sa_abs: 0.75
      weight: 1.0
    fy:
      enabled: false
      sa_abs: 1.0
      sr_abs: 0.03
      weight: 1.0
    mz:
      enabled: false
      sr_abs: 0.03
      sa_min_abs: 1.0
      sa_max_abs: 12.5
      weight: 1.0
      low_fz_max: 300
      low_fz_weight: 1.0
  local_stiffness_targets:
    enabled: false
    loss_weight: 0.0
    fz_targets: [200, 650, 950, 1150]
    fz_tolerance: 90.0
    min_samples: 30
    sr_delta: 0.005
    sa_delta_deg: 0.1
    fx:
      enabled: true
      sr_abs: 0.02
      sa_abs: 0.75
    fy:
      enabled: true
      sa_abs: 1.0
      sr_abs: 0.03
  mz_shape_targets:
    enabled: false
    loss_weight: 0.0
    fz_targets: [200, 400, 650, 950, 1150]
    fz_tolerance: 90.0
    sr_abs: 0.03
    ia_abs: 1.0
    min_samples: 25
    target_scale_nm: 25.0
    target_weight: 1.0
    low_fz_max: 300
    low_fz_weight: 1.0
    temperature_bins:
      - [null, null]
    temperature_bin_weight: 1.0
    sa_bins:
      - [-12.0, -9.0]
      - [-9.0, -6.0]
      - [-6.0, -3.0]
      - [-3.0, -1.0]
      - [1.0, 3.0]
      - [3.0, 6.0]
      - [6.0, 9.0]
      - [9.0, 12.0]

# TTC Data Paths
data_paths:
  drivebrake: "data/tiredata/DriveBrake-Hoosier18.0×6.0-10-R20.csv"
  cornering: "data/tiredata/Cornering-Hoosier18.0×6.0-10-R20.csv"

