# Input Ranges (physical units — must match TTC raw data units!)
# TTC data: SA in degrees, IA in degrees, TSTC in °C
input_ranges:
  sr: [-0.5, 0.5]       # slip ratio (dimensionless)
  sa: [-13.0, 13.0]     # degrees (TTC raw)
  fz: [100, 2000]       # N
  ia: [-5.0, 5.0]       # degrees (TTC raw)
  tstc: [25.0, 90.0]    # °C (TTC raw)

# Output Directory
output:
  dir: "output/pinn"
  checkpoint_dir: "output/pinn/checkpoints"
  tensorboard_dir: "output/pinn/tensorboard"
  runtime_root: "output/tire_models"

# Runtime post-processing mirrors the C++ deployment path.
runtime_postprocess:
  enabled: true
  friction_cap_mu: 2.6
  zero_slip_sr_scale: 0.03
  zero_slip_sa_scale_deg: 0.5
  symmetry_sr_scale: 0.05
  symmetry_ia_scale_deg: 0.75
  sa_zero_fy_scale_deg: 0.3
  epsilon: 1.0e-9

# Hardware
hardware:
  device: "auto"  # auto, cuda, mps, or cpu
  num_workers: 0
  pin_memory: true

# Validation Targets (for pass/fail criteria)
validation_targets:
  r2_min: 0.90                   # user-approved minimum for deployable Fx/Fy accuracy
  mz_r2_min: 0.80                # Mz is used by the vehicle steering SAT path
  zero_slip_max_force_n: 20.0    # N
  zero_slip_max_moment_nm: 50.0  # Nm
  friction_violation_rate: 0.05  # synthetic probe
  measured_friction_violation_rate: 0.15  # measured holdout distribution
  measured_friction_mu_cap: 2.6
  measured_combined_slip_violation_rate: 0.35
  symmetry_mean_max_error: 0.25  # mean normalized antisymmetry
