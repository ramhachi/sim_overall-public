services:
  fsae-sim:
    build:
      context: .
      dockerfile: Dockerfile
    image: fsae-sim:latest
    container_name: fsae-sim-dev

    # ソースコードをマウント
    volumes:
      - .:/workspace
      - build-cache:/workspace/build

    # インタラクティブモード
    stdin_open: true
    tty: true

    # 開発用ポート（将来の可視化サーバー用）
    ports:
      - "${FSAE_HOST_UI_PORT:-8080}:8080"
      - "${FSAE_HOST_RL_PORT:-22345}:12345"
      - "${FSAE_HOST_FEM_PORT:-50051}:50051"  # FEM TCP server

    # 環境変数
    environment:
      - CMAKE_BUILD_TYPE=Release
      - TERM=xterm-256color

    # 作業ディレクトリ
    working_dir: /workspace

# ビルドキャッシュ用ボリューム
volumes:
  build-cache:
